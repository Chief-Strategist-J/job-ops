services:
  - type: web
    name: job-ops
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: job-ops-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3001
      - key: DATA_DIR
        value: /app/data
      - key: NODE_ENV
        value: production
